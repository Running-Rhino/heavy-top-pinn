<style>
  :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #e6f0fb; background: #0c1420; }
  * { box-sizing: border-box; }
  body { margin: 0; line-height: 1.55; }
  main { width: min(1160px, 100% - 36px); margin: 36px auto; }
  header { margin-bottom: 22px; }

  .stage, aside { border: 1px solid #32485f; border-radius: 14px; background: #142131; overflow: hidden; }
  .scene { display: block; width: 100%; height: clamp(350px, 58vh, 650px); touch-action: none; cursor: grab; }
  .scene:active { cursor: grabbing; }
  .controls { border-top: 1px solid #32485f; padding: 14px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select { font: inherit; font-size: 14px; padding: 7px 11px; color: inherit; background: #21354a; border: 1px solid #46627f; border-radius: 7px; cursor: pointer; }

  button[aria-pressed="true"] { border-color: #65e1d8; color: #8ff2ea; }
  #play { background: #78e0d5; color: #102334; border-color: #78e0d5; min-width: 70px; font-weight: 700; }
  #seek { width: 100%; margin: 0; accent-color: #78e0d5; cursor: pointer; }
  .time { margin-left: auto; font-variant-numeric: tabular-nums; }
  aside { padding: 18px; }
  .legend { display: grid; gap: 8px; padding: 0; list-style: none; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; }
  .readouts { border-top: 1px solid #32485f; margin-top: 18px; padding-top: 14px; }
  dl { margin: 0; }
  dt { color: #b2c5d9; font-size: 14px; margin-top: 10px; }
  dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; font-size: 16px; }
  .note { font-size: 14px; }
  @media (max-width: 790px) { .layout { grid-template-columns: 1fr; } main { margin-top: 22px; } }
</style>
</head>

<main>
  <header>
    <h1>重力陀螺</h1>
    <p>固定支点下的三维运动 · 根据本题初值数值积分</p>
  </header>
  <div class="layout">
    <section class="stage" aria-label="陀螺动画">
      <canvas id="scene" class="scene" aria-label="可拖动改变视角的三维陀螺动画">请使用支持 Canvas 的浏览器。</canvas>
      <div class="controls">
        <div class="row">
          <button id="play" type="button">播放</button>
          <button id="reset" type="button">回到初态</button>
          <label for="speed">速度</label>
          <select id="speed">
            <option value="0.05">0.05 倍</option>
            <option value="0.15" selected>0.15 倍</option>
            <option value="0.5">0.5 倍</option>
            <option value="1">原速</option>
          </select>
          <output id="time" class="time">0.000 s</output>
        </div>
        <input id="seek" type="range" min="0" max="1" value="0" step="0.0005" aria-label="模拟时间">
        <div class="row" aria-label="选择观察视角">
          <button type="button" data-view="iso" aria-pressed="true">三维</button>
          <button type="button" data-view="top" aria-pressed="false">俯视</button>
          <button type="button" data-view="side" aria-pressed="false">侧视</button>
        </div>
      </div>
    </section>
    <aside>
      <h2>观察什么</h2>
      <ul class="legend">
        <li><span class="dot" style="background:#ffc175"></span>标记点绕圆盘中心转动，可看出自旋。</li>
        <li><span class="dot" style="background:#78e0d5"></span>轨迹记录质心走过的位置。俯视可看进动，侧视可看高度变化。</li>
      </ul>
      <p class="note">拖动画面可以转动视角。连杆初始水平，球副让它能自由改变方向。</p>
      <div class="readouts">
        <h2>当前状态</h2>
        <dl>
          <dt>质心高度（相对支点）</dt><dd id="height"></dd>
          <dt>连杆仰角（相对水平）</dt><dd id="tilt"></dd>
          <dt>物体坐标系角速度 ωₓ / ωᵧ / ω𝓏</dt><dd id="omega"></dd>
        </dl>
      </div>
      <p class="note">轨迹由 SciPy 求解，将题给的 J 视为质心惯性张量。连杆长 1 m，圆盘外形用于示意。</p>
    </aside>
  </div>
</main>

<script>
"use strict";
const {dt, samples} = JSON.parse(document.querySelector("#trajectory").textContent);
const endTime = dt * (samples.length - 1);
const canvas = document.querySelector("#scene");
const ctx = canvas.getContext("2d");
const play = document.querySelector("#play");
const seek = document.querySelector("#seek");
const speed = document.querySelector("#speed");
const timeLabel = document.querySelector("#time");
const height = document.querySelector("#height");
const tilt = document.querySelector("#tilt");
const omegaLabel = document.querySelector("#omega");
const views = document.querySelectorAll("[data-view]");
const origin = [0, 0, 0];
const accent = "#78e0d5", orange = "#ffc175";
let time = 0, playing = false, yaw = 0.95, pitch = 0.48;
let width = 0, screenHeight = 0, previous = null, drag = null;
seek.max = endTime;

function stateAt(t) {
  const u = Math.min(samples.length - 1, Math.max(0, t / dt));
  const low = Math.min(Math.floor(u), samples.length - 2);
  const a = samples[low], b = samples[low + 1], weight = u - low;
  // Quaternions use (x,y,z,w). Align their signs before interpolating.
  const sign = a.slice(0, 4).reduce((sum, x, i) => sum + x * b[i], 0) < 0 ? -1 : 1;
  const q = a.slice(0, 4).map((x, i) => (1 - weight) * x + weight * sign * b[i]);
  const norm = Math.hypot(...q);
  const [x, y, z, w] = q.map(value => value / norm);
  const matrix = [
    [1 - 2*(y*y + z*z), 2*(x*y - z*w), 2*(x*z + y*w)],
    [2*(x*y + z*w), 1 - 2*(x*x + z*z), 2*(y*z - x*w)],
    [2*(x*z - y*w), 2*(y*z + x*w), 1 - 2*(x*x + y*y)]
  ];
  const omega = a.slice(4).map((x, i) => x + weight * (b[i+4] - x));
  return {matrix, omega};
}
const toWorld = (r, [x, y, z]) => r.map(row => row[0]*x + row[1]*y + row[2]*z);
const trail = Array.from({length: 401}, (_, i) => toWorld(stateAt(endTime * i / 400).matrix, [0, 1, 0]));

function project([x, y, z]) {
  const scale = Math.min(width / 3.05, screenHeight / 2.45);
  const sx = x * Math.cos(yaw) - y * Math.sin(yaw);
  const depth = x * Math.sin(yaw) + y * Math.cos(yaw);
  const sy = z * Math.cos(pitch) - depth * Math.sin(pitch);
  return [width * 0.5 + scale * sx, screenHeight * 0.49 - scale * sy,
          depth * Math.cos(pitch) + z * Math.sin(pitch)];
}
function path(points, {stroke, fill, lineWidth=1, close=false}) {
  ctx.beginPath();
  points.map(project).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  if (close) ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
}
function dot(point, radius, color) {
  const [x,y] = project(point);
  ctx.beginPath(); ctx.arc(x,y,radius,0,2*Math.PI);
  ctx.fillStyle = color; ctx.fill();
}
function label(point, text, color) {
  const [x,y] = project(point);
  ctx.fillStyle = color; ctx.font = '600 14px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText(text, x+7, y-7);
}

function draw() {
  if (!width || !screenHeight) return;
  const {matrix, omega} = stateAt(time);
  const world = point => toWorld(matrix, point);
  const com = world([0, 1, 0]);
  const background = ctx.createRadialGradient(width*.52, screenHeight*.42, 10, width*.5, screenHeight*.5, width*.7);
  background.addColorStop(0, "#203750"); background.addColorStop(1, "#101a29");
  ctx.fillStyle = background; ctx.fillRect(0,0,width,screenHeight);

  for (let i = -6; i <= 6; i++) {
    const x = i * .2;
    path([[x,-1.2,0],[x,1.2,0]], {stroke:"#2b435a"});
    path([[-1.2,x,0],[1.2,x,0]], {stroke:"#2b435a"});
  }
  [[[1.27,0,0],"X","#ff9c91"],[[0,1.27,0],"Y","#a9e087"],[[0,0,1.03],"Z","#8bbfff"]]
    .forEach(([p, name, color]) => {
      path([origin,p],{stroke:color,lineWidth:1.4}); label(p,name,color);
    });
  const trailEnd = Math.floor(time / endTime * (trail.length - 1));
  path([...trail.slice(0, trailEnd+1), com], {stroke:accent,lineWidth:2});
  path([origin,com], {stroke:"#7391aa",lineWidth:8});
  path([origin,com], {stroke:"#d4e6f4",lineWidth:3});
  dot(origin, 7, "#f2f6fa");
  label(origin, "支点", "#f2f6fa");

  const radius = .235, front = 1.044, back = .956, count = 40;
  const ring = (y, i, r=radius) => {
    const angle = i * 2 * Math.PI / count;
    return world([r*Math.cos(angle), y, r*Math.sin(angle)]);
  };
  const faces = [];
  for (let i=0;i<count;i++) {
    faces.push({
      points: [ring(front,i),ring(front,i+1),ring(back,i+1),ring(back,i)],
      fill: i < 3 ? orange : (i % 2 ? "#3a5b76" : "#466b88")
    });
  }
  for (const y of [back,front]) {
    faces.push({points:Array.from({length:count}, (_,i)=>ring(y,i)), fill:y===front?"#315977":"#28465f", face:y});
  }
  const depth = face => face.points.reduce((sum,p)=>sum+project(p)[2],0)/face.points.length;
  const nearFace = project(world([0,front,0]))[2] >= project(world([0,back,0]))[2] ? front : back;
  faces.sort((a,b)=>depth(a)-depth(b)).forEach(face => {
    if (face.face === nearFace) return;
    path(face.points,{fill:face.fill,close:true});
  });
  const cap = faces.find(face => face.face === nearFace);
  path(cap.points,{fill:cap.fill,stroke:"#83a6bf",lineWidth:1.2,close:true});
  const hub = world([0,nearFace,0]), marker = ring(nearFace,1,radius*.86);
  path([hub,marker],{stroke:orange,lineWidth:3});
  dot(hub,4,accent); dot(marker,5,orange);

  timeLabel.value = time.toFixed(3) + " s";
  seek.value = time;
  height.textContent = com[2].toFixed(3) + " m";
  tilt.textContent = (Math.atan2(com[2], Math.hypot(com[0],com[1])) * 180/Math.PI).toFixed(2) + "°";
  omegaLabel.textContent = omega.map(value=>value.toFixed(2)).join(" / ") + " rad/s";
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  width = rect.width; screenHeight = rect.height;
  const density = window.devicePixelRatio || 1;
  canvas.width = Math.round(width*density); canvas.height = Math.round(screenHeight*density);
  ctx.setTransform(density,0,0,density,0,0);
  draw();
}
function setPlaying(value) {
  playing = value;
  play.textContent = playing ? "暂停" : "播放";
}
function tick(now) {
  if (playing && previous !== null) {
    time = Math.min(endTime, time + Math.min(.05,(now-previous)/1000)*Number(speed.value));
    if (time === endTime) setPlaying(false);
    draw();
  }
  previous = now;
  requestAnimationFrame(tick);
}
play.addEventListener("click", () => {
  if (time >= endTime) time = 0;
  setPlaying(!playing); draw();
});
document.querySelector("#reset").addEventListener("click", () => {
  time = 0; setPlaying(false); draw();
});
seek.addEventListener("input", () => { time = Number(seek.value); setPlaying(false); draw(); });
const positions = {iso:[.95,.48], top:[0,Math.PI/2], side:[Math.PI/2,0]};
views.forEach(button => button.addEventListener("click", () => {
  [yaw,pitch] = positions[button.dataset.view];
  views.forEach(item => item.setAttribute("aria-pressed", item===button));
  draw();
}));
canvas.addEventListener("pointerdown", event => {
  drag = [event.clientX,event.clientY]; canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (!drag) return;
  yaw += (event.clientX-drag[0])*.009;
  pitch = Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch+(event.clientY-drag[1])*.009));
  drag = [event.clientX,event.clientY];
  views.forEach(item => item.setAttribute("aria-pressed",false));
  draw();
});
for (const event of ["pointerup","pointercancel","lostpointercapture"]) {
  canvas.addEventListener(event,()=>{drag=null;});
}
new ResizeObserver(resize).observe(canvas);
resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
