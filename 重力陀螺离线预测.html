<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重力陀螺 · 离线预测</title>
<style>
  :root {
    color-scheme: dark;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0c1521; color: #ebf2f9;
    --panel: #142232; --line: #34495f; --muted: #b0c4d8; --accent: #76e4d4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; line-height: 1.55; }
  main { width: min(1190px, 100% - 40px); margin: 34px auto; }
  header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.12; }
  h2 { font-size: 20px; margin: 0; }
  p { margin: 7px 0 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(285px, 340px); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
  .control, .readouts { padding: 16px; }
  .control { border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  label, button, input { font: inherit; font-size: 15px; }
  button, input[type=number] { border: 1px solid #4b6279; border-radius: 7px; padding: 6px 11px; color: inherit; background: #21364b; }
  input[type=number] { width: 8.2rem; font-variant-numeric: tabular-nums; }
  button { cursor: pointer; }
  button:hover { background: #2e4b63; }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #101f2d; border-color: var(--accent); font-weight: 700; }
  button.primary:hover { background: #a2f2e8; }
  :focus-visible { outline: 2px solid #ffc37e; outline-offset: 3px; }
  output, .values { font-variant-numeric: tabular-nums; }
  .time-value { margin-left: auto; color: var(--accent); font-size: 15px; }
  input[type=range] { display: block; width: 100%; margin: 10px 0 0; accent-color: var(--accent); cursor: pointer; }
  .error { color: #ffb2a7; font-size: 14px; }
  .error:empty { display: none; }
  canvas { display: block; width: 100%; height: clamp(310px, 52vh, 560px); touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .views { padding: 12px 16px; border-top: 1px solid var(--line); }
  .hint { font-size: 14px; }
  .legend { display: inline-block; margin-right: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .readouts h3 { margin: 16px 0 6px; font-size: 15px; font-weight: 600; }
  .readouts h3 span { color: var(--muted); font-size: 13px; font-weight: 400; }
  .values { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
  .cell { background: #1b2e41; border-radius: 6px; text-align: center; padding: 5px 2px; white-space: nowrap; }
  .value { font-family: Consolas, "Segoe UI Mono", monospace; font-size: clamp(12px, 1.5vw, 14px); }
  .vector-label { display: block; color: var(--muted); font-size: 12px; }
  .matrix { border-inline: 2px solid #6c89a5; border-radius: 5px; padding: 3px 5px; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 5px 8px; border-top: 1px solid var(--line); margin: 16px 0 0; padding-top: 12px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; color: var(--accent); }
  @media (max-width: 790px) { .layout { grid-template-columns: minmax(0, 1fr); } main { margin-top: 20px; } }
  @media (max-width: 410px) { main { width: calc(100% - 20px); } .time-value { margin-left: 0; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>重力陀螺</h1>
    <p>离线 PINN 预测 · 输入时间，查看陀螺在空间中的姿态</p>
  </header>
  <div class="layout">
    <section class="card" aria-label="模型和时间控制">
      <div class="control">
        <form id="time-form" class="row" novalidate>
          <label for="time-input">时间 t（秒）</label>
          <input id="time-input" type="number" step="any" value="0" aria-describedby="range-label time-error">
          <button class="primary" type="submit">预测</button>
          <button id="play" type="button" aria-pressed="false">慢速播放</button>
          <output id="time-display" class="time-value">0.0000 s</output>
        </form>
        <p class="hint" id="range-label"></p>
        <p class="error" id="time-error" role="alert"></p>
        <input id="seek" type="range" step="0.0005" value="0" aria-label="选择预测时刻">
      </div>
      <canvas id="scene" aria-label="重力陀螺姿态模型，拖动可以转动视角">
        请用支持 Canvas 的浏览器打开本文件。
      </canvas>
      <div class="views">
        <div class="row" aria-label="观察视角">
          <button data-view="iso" type="button" aria-pressed="true">三维</button>
          <button data-view="top" type="button" aria-pressed="false">俯视</button>
          <button data-view="side" type="button" aria-pressed="false">侧视</button>
        </div>
        <p class="hint">
          <span class="legend"><span class="dot" style="background:#ffc37e"></span>圆盘自旋标记</span>
          <span class="legend"><span class="dot" style="background:#76e4d4"></span>质心</span>
          拖动模型可改变视角
        </p>
      </div>
    </section>
    <aside class="card readouts" aria-label="预测结果">
      <h2>当前预测</h2>
      <h3>姿态矩阵 R <span>物体坐标 → 空间坐标</span></h3>
      <div id="matrix" class="values matrix" aria-label="姿态矩阵的九个元素，按行排列"></div>
      <h3>角速度 <span>物体坐标 · rad/s</span></h3>
      <div id="omega" class="values" aria-label="三个角速度分量"></div>
      <h3>质心位置 <span>相对支点的空间坐标 · m</span></h3>
      <div id="position" class="values" aria-label="三个质心位置分量"></div>
      <dl>
        <dt>连杆仰角</dt><dd id="tilt" class="value"></dd>
        <dt>质心高度</dt><dd id="height" class="value"></dd>
      </dl>
      <p class="hint">网格是经过支点的水平面。圆盘外形用于示意，姿态由训练好的 PINN 实时预测。</p>
    </aside>
  </div>
</main>

<script>
"use strict";

const packed = JSON.parse(document.querySelector("#network-data").textContent);
const [startTime, endTime] = packed.time_range_s;

function applyLinear(input, {weight, bias}) {
  return weight.map((row, i) => row.reduce((sum, item, j) => sum + item * input[j], bias[i]));
}

function matrixFromQuaternion([w, x, y, z]) {
  return [
    [1 - 2 * (y*y + z*z), 2 * (x*y - w*z), 2 * (x*z + w*y)],
    [2 * (x*y + w*z), 1 - 2 * (x*x + z*z), 2 * (y*z - w*x)],
    [2 * (x*z - w*y), 2 * (y*z + w*x), 1 - 2 * (x*x + y*y)],
  ];
}

const dotProduct = (a, b) => a.reduce((sum, item, i) => sum + item * b[i], 0);
const multiplyVector = (matrix, vector) => matrix.map(row => dotProduct(row, vector));
const transpose = matrix => matrix[0].map((_, j) => matrix.map(row => row[j]));
const multiplyMatrix = (a, b) => {
  const columns = transpose(b);
  return a.map(row => columns.map(column => dotProduct(row, column)));
};

function predict(t) {
  const s = t / endTime;
  const [first, second, output] = packed.layers;
  const hidden1 = applyLinear([s], first).map(Math.tanh);
  const hidden2 = applyLinear(hidden1, second).map(Math.tanh);
  const [a, b, c, ux, uz] = applyLinear(hidden2, output);
  const q = [1, s * a, s * b, s * c];
  const norm = Math.hypot(...q);
  const correction = matrixFromQuaternion(q.map(value => value / norm));
  const [initialX, spinRate, initialZ] = packed.omega_initial;
  const halfAngle = 0.5 * spinRate * t;
  const spin = matrixFromQuaternion([Math.cos(halfAngle), 0, Math.sin(halfAngle), 0]);
  const rotation = multiplyMatrix(correction, spin);
  const omega = multiplyVector(transpose(spin), [initialX + s * ux, spinRate, initialZ + s * uz]);
  return {rotation, omega, position: multiplyVector(rotation, packed.lever_body_m)};
}

const element = id => document.getElementById(id);
const canvas = element("scene"), ctx = canvas.getContext("2d");
const timeInput = element("time-input"), seek = element("seek"), play = element("play");
const timeDisplay = element("time-display"), errorBox = element("time-error");
const viewButtons = document.querySelectorAll("[data-view]");
const views = {iso: [0.88, 0.53], top: [0, Math.PI / 2], side: [Math.PI / 2, 0]};
const accent = "#76e4d4", markerColor = "#ffc37e";
const origin = [0, 0, 0];
let [yaw, pitch] = views.iso;
let time = startTime, prediction = predict(time);
let viewport = {width: 0, height: 0}, drag = null;
let animation = null, lastFrame = null;

function makeCells(container, labels) {
  return labels.map(label => {
    const cell = document.createElement("div");
    cell.className = "cell";
    if (label !== null) {
      const name = document.createElement("span");
      name.className = "vector-label";
      name.textContent = label;
      cell.append(name);
    }
    const value = document.createElement("span");
    value.className = "value";
    cell.append(value);
    container.append(cell);
    return value;
  });
}
const matrixCells = makeCells(element("matrix"), Array(9).fill(null));
const omegaCells = makeCells(element("omega"), ["ωₓ", "ωᵧ", "ω_z"]);
const positionCells = makeCells(element("position"), ["x", "y", "z"]);
timeInput.min = seek.min = String(startTime);
timeInput.max = seek.max = String(endTime);
element("range-label").textContent = `可输入 ${startTime}–${endTime} 秒内的任意时刻，也可以拖动滑块。`;

function format(value, places) {
  return Number(value.toFixed(places)) === 0 ? (0).toFixed(places) : value.toFixed(places);
}

function showPrediction(t) {
  time = t;
  prediction = predict(t);
  timeInput.value = String(t);
  seek.value = String(t);
  timeDisplay.value = format(t, 6) + " s";
  prediction.rotation.flat().forEach((number, i) => { matrixCells[i].textContent = format(number, 6); });
  prediction.omega.forEach((number, i) => { omegaCells[i].textContent = format(number, 6); });
  prediction.position.forEach((number, i) => { positionCells[i].textContent = format(number, 6); });
  const [x, y, z] = prediction.position;
  element("height").textContent = format(z, 6) + " m";
  element("tilt").textContent = format(Math.atan2(z, Math.hypot(x,y)) * 180 / Math.PI, 3) + "°";
  drawScene();
}

function camera() {
  const {width, height} = viewport;
  const scale = Math.min(width / 2.9, height / 2.85);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const direction = [sy * cp, cy * cp, sp];
  return {
    direction,
    project([x, y, z]) {
      const depth = x * sy + y * cy;
      return [
        width * 0.5 + scale * (x * cy - y * sy),
        height * 0.47 - scale * (z * cp - depth * sp),
        dotProduct(direction, [x, y, z]),
      ];
    },
  };
}

function drawPath(project, points, {fill, stroke, width = 1, closed = false} = {}) {
  ctx.beginPath();
  points.forEach((point, index) => {
    const [x, y] = project(point);
    if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  if (closed) ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = width; ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawDot(project, point, color, radius) {
  const [x, y] = project(point);
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawLabel(project, point, text, color) {
  const [x, y] = project(point);
  ctx.font = '600 14px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(text, x + 8, y - 8);
}

function cylinderFaces(world, direction, radius, lowY, highY, color, marked) {
  const count = 40;
  const ring = (y, angle) => world([radius * Math.cos(angle), y, radius * Math.sin(angle)]);
  const faces = [];
  const light = [0.31, 0.42, 0.85];
  function addFace(points, normal, stripe, detail) {
    const worldNormal = world(normal);
    if (dotProduct(worldNormal, direction) <= 1e-5) return;
    const lightness = 0.45 + 0.55 * Math.max(0, dotProduct(worldNormal, light));
    const fill = stripe ? markerColor : "rgb(" + color.map(value => Math.round(value * lightness)).join(",") + ")";
    const depth = points.reduce((sum, point) => sum + dotProduct(direction, point), 0) / points.length;
    faces.push({points, fill, depth, detail});
  }
  for (let i = 0; i < count; i++) {
    const a = 2 * Math.PI * i / count, b = 2 * Math.PI * (i + 1) / count;
    const mid = (a + b) * 0.5;
    addFace([ring(lowY,a), ring(highY,a), ring(highY,b), ring(lowY,b)],
            [Math.cos(mid),0,Math.sin(mid)], marked && (i === 0 || i === count - 1));
  }
  for (const [y, sign] of [[lowY, -1], [highY, 1]]) {
    const points = Array.from({length: count}, (_, i) => ring(y, i * 2 * Math.PI / count));
    addFace(points, [0, sign, 0], false, marked ? {
      hub: world([0, y, 0]), marker: world([radius * 0.83, y, 0]),
    } : null);
  }
  return faces;
}

function drawScene() {
  const {width, height} = viewport;
  if (!width || !height) return;
  const {project, direction} = camera();
  const {rotation, position} = prediction;
  const world = vector => multiplyVector(rotation, vector);
  const background = ctx.createRadialGradient(width * 0.52, height * 0.44, 5, width * 0.52, height * 0.44, Math.max(width, height) * 0.68);
  background.addColorStop(0, "#21394e");
  background.addColorStop(1, "#101b2b");
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, width, height);

  for (let i = -6; i <= 6; i++) {
    const tick = i * 0.2;
    drawPath(project, [[tick,-1.2,0],[tick,1.2,0]], {stroke:"#344e65"});
    drawPath(project, [[-1.2,tick,0],[1.2,tick,0]], {stroke:"#344e65"});
  }
  for (const [axis, label, color] of [
    [[1.25,0,0],"X","#ff9d91"], [[0,1.25,0],"Y","#b0e396"], [[0,0,1.05],"Z","#9bc8ff"],
  ]) {
    if (Math.hypot(...project(axis).slice(0,2).map((x,i)=> x-project(origin)[i])) < 4) continue;
    drawPath(project, [origin, axis], {stroke:color, width:1.4});
    drawLabel(project, axis, label, color);
  }
  const [x, y, z] = position;
  if (Math.abs(z) > 0.005) {
    ctx.setLineDash([5,5]);
    drawPath(project, [[x,y,0], position], {stroke:"#87c4ca"});
    ctx.setLineDash([]);
  }
  const faces = [
    ...cylinderFaces(world, direction, 0.031, 0, 0.968, [198, 225, 246], false),
    ...cylinderFaces(world, direction, 0.235, 0.957, 1.043, [111, 177, 216], true),
  ];
  faces.sort((a,b) => a.depth - b.depth).forEach(face => {
    drawPath(project, face.points, {fill:face.fill, closed:true});
    if (face.detail) {
      drawPath(project, [face.detail.hub, face.detail.marker], {stroke:markerColor, width:3});
      drawDot(project, face.detail.hub, accent, 4);
      drawDot(project, face.detail.marker, markerColor, 5);
    }
  });
  drawDot(project, origin, "#eef5fd", 6);
  drawLabel(project, origin, "支点", "#eef5fd");
  drawDot(project, position, accent, 3);
}

function resize() {
  const {width, height} = canvas.getBoundingClientRect();
  viewport = {width, height};
  const density = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * density);
  canvas.height = Math.round(height * density);
  ctx.setTransform(density, 0, 0, density, 0, 0);
  drawScene();
}

function stopPlayback() {
  if (animation !== null) cancelAnimationFrame(animation);
  animation = lastFrame = null;
  play.setAttribute("aria-pressed", "false");
  play.textContent = "慢速播放";
}

function advance(now) {
  if (lastFrame !== null) {
    const elapsed = Math.min(0.05, (now - lastFrame) / 1000);
    const next = Math.min(endTime, Number((time + elapsed * 0.15).toFixed(6)));
    showPrediction(next);
    if (next === endTime) {
      stopPlayback();
      return;
    }
  }
  lastFrame = now;
  animation = requestAnimationFrame(advance);
}

element("time-form").addEventListener("submit", event => {
  event.preventDefault();
  stopPlayback();
  const value = timeInput.valueAsNumber;
  if (!Number.isFinite(value) || value < startTime || value > endTime) {
    timeInput.setAttribute("aria-invalid", "true");
    errorBox.textContent = `请输入 ${startTime} 到 ${endTime} 秒之间的时间。`;
    timeInput.focus();
    return;
  }
  timeInput.removeAttribute("aria-invalid");
  errorBox.textContent = "";
  showPrediction(value);
});
seek.addEventListener("input", () => {
  stopPlayback();
  timeInput.removeAttribute("aria-invalid");
  errorBox.textContent = "";
  showPrediction(Number(seek.value));
});
play.addEventListener("click", () => {
  if (animation !== null) { stopPlayback(); return; }
  timeInput.removeAttribute("aria-invalid");
  errorBox.textContent = "";
  if (time === endTime) showPrediction(startTime);
  play.setAttribute("aria-pressed", "true");
  play.textContent = "暂停";
  animation = requestAnimationFrame(advance);
});
viewButtons.forEach(button => button.addEventListener("click", () => {
  [yaw, pitch] = views[button.dataset.view];
  viewButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
  drawScene();
}));
canvas.addEventListener("pointerdown", event => {
  drag = {x: event.clientX, y: event.clientY};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (drag === null) return;
  yaw += (event.clientX - drag.x) * 0.009;
  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch + (event.clientY - drag.y) * 0.009));
  drag = {x: event.clientX, y: event.clientY};
  viewButtons.forEach(button => button.setAttribute("aria-pressed", "false"));
  drawScene();
});
for (const action of ["pointerup", "pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(action, () => { drag = null; });
}
new ResizeObserver(resize).observe(canvas);
resize();
showPrediction(startTime);
</script>
</body>
</html>
